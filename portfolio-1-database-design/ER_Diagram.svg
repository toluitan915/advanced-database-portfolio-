<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670"><rect width="1000" height="670" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#15283c}.title{font-size:25px;font-weight:bold}.field{font-size:17px}.head{font-size:20px;font-weight:bold;fill:white}.rel{font-size:16px}</style><text x="40" y="45" class="title">Lumen Training Centre — relational model</text><rect x="40" y="90" width="280" height="200" rx="8" fill="white" stroke="#9bb0c5"/><path d="M48,90 H312 Q320,90 320,98 V130 H40 V98 Q40,90 48,90" fill="#194a71"/><text x="55" y="118" class="head">Students</text><text x="55" y="158" class="field">PK StudentID</text><text x="55" y="184" class="field">FullName</text><text x="55" y="210" class="field">UQ Email</text><text x="55" y="236" class="field">City</text><rect x="660" y="90" width="280" height="200" rx="8" fill="white" stroke="#9bb0c5"/><path d="M668,90 H932 Q940,90 940,98 V130 H660 V98 Q660,90 668,90" fill="#194a71"/><text x="675" y="118" class="head">Courses</text><text x="675" y="158" class="field">PK CourseID</text><text x="675" y="184" class="field">UQ CourseCode</text><text x="675" y="210" class="field">CourseTitle</text><text x="675" y="236" class="field">CourseFee</text><text x="675" y="262" class="field">Capacity</text><rect x="350" y="340" width="280" height="200" rx="8" fill="white" stroke="#9bb0c5"/><path d="M358,340 H622 Q630,340 630,348 V380 H350 V348 Q350,340 358,340" fill="#194a71"/><text x="365" y="368" class="head">Enrolments</text><text x="365" y="408" class="field">PK EnrolmentID</text><text x="365" y="434" class="field">FK StudentID, FK CourseID</text><text x="365" y="460" class="field">EnrolledOn, AgreedFee</text><text x="365" y="486" class="field">UQ (StudentID, CourseID)</text><rect x="660" y="340" width="280" height="200" rx="8" fill="white" stroke="#9bb0c5"/><path d="M668,340 H932 Q940,340 940,348 V380 H660 V348 Q660,340 668,340" fill="#194a71"/><text x="675" y="368" class="head">Payments</text><text x="675" y="408" class="field">PK PaymentID</text><text x="675" y="434" class="field">FK EnrolmentID</text><text x="675" y="460" class="field">Amount, PaidOn</text><text x="675" y="486" class="field">UQ PaymentReference</text><path d="M180 290 V315 H440 V340 M800 290 V315 H570 V340 M630 450 H660" fill="none" stroke="#476982" stroke-width="2"/><text x="187" y="309" class="rel">1</text><text x="397" y="334" class="rel">0..*</text><text x="810" y="310" class="rel">1</text><text x="575" y="334" class="rel">0..*</text><text x="631" y="439" class="rel">1</text><text x="631" y="474" class="rel">0..*</text><text x="40" y="596" class="field">Students 1 → 0..* Enrolments; Courses 1 → 0..* Enrolments</text><text x="40" y="626" class="field">Enrolments 1 → 0..* Payments. PK = primary key; FK = foreign key; UQ = unique.</text></svg>
